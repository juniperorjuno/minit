[package]
name = "minit"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.36.2"
egui = "0.36.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
image = "0.25.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
